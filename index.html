<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | TMGM Partners</title>
<!-- Thank-you pages must not be indexed -->
<meta name="robots" content="noindex, nofollow">
<!-- TODO (OP team): add the same Google Tag Manager / Google tag snippet that is on the live pages here -->
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;background:#f5f7fa;line-height:1.5}
  main{max-width:640px;margin:0 auto;padding:64px 24px;text-align:center}
  .tick{width:64px;height:64px;border-radius:50%;background:#e6f4ea;color:#1e8e3e;font-size:36px;line-height:64px;margin:0 auto 24px}
  h1{font-size:28px;margin:0 0 12px}
  p{font-size:16px;margin:0 0 16px}
  ol{text-align:left;max-width:460px;margin:24px auto;padding-left:20px}
  li{margin-bottom:8px}
  .btns{margin-top:32px}
  .btn{display:inline-block;margin:6px;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:bold;border:2px solid #1f3864;background:#1f3864;color:#fff}
  small{display:block;margin-top:32px;color:#666}
</style>
</head>
<!--
  ONE TEMPLATE, FIVE PAGES.
  Set data-page on <body> to: home | ib | affiliate | hybrid | influencer.
  Only the programme name changes between pages (see PAGES below).
-->
<body data-page="ib">
<main>
  <div class="tick" aria-hidden="true">&#10003;</div>
  <h1 id="ty-title" tabindex="-1"></h1>
  <p id="ty-lead"></p>
  <ol>
    <li>We will review your details.</li>
    <li>A partnership manager will contact you within 7 business days.</li>
    <li>They'll ask you a few questions and help you getting your partner account.</li>
  </ol>
  <div class="btns">
    <a class="btn" href="/">Back to TMGM Partners</a>
  </div>
  <small>Questions? Email our support team at <a href="mailto:support@tmgm.com">support@tmgm.com</a></small>
</main>

<script>
// Programme name used in the title and the first sentence
var PAGES = {
  home: "Partner",
  ib: "Introducing Brokers",
  affiliate: "Affiliate",
  hybrid: "Hybrid",
  influencer: "Finfluencer"
};
(function () {
  var name = PAGES[document.body.getAttribute("data-page")] || PAGES.home;
  var t = document.getElementById("ty-title");
  t.textContent = "Thank you, your " + name + " application is in!";
  document.getElementById("ty-lead").textContent = "Thanks for your interest in becoming TMGM " + name + ". We've received your details.";
  document.title = "Thank you | TMGM Partners";
  t.focus();
})();
</script>
</body>
</html>
