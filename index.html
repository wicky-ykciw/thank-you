<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-text: #166534;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 540px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success-text);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 24px;
    }

    .summary {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 28px;
      text-align: left;
    }

    .summary span {
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">&#10003;</div>
    <h1>You're all set</h1>
    <p id="message">
      Thank you for reaching out. We have received your submission and will follow up shortly.
    </p>

    <div class="summary" id="details" hidden>
      <div><span>Reference:</span> <strong id="ref-id">-</strong></div>
      <div><span>Submitted for:</span> <strong id="user-email">-</strong></div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary" id="home-btn">Back to Home</a>
      <button type="button" class="btn btn-secondary" id="copy-btn" hidden>Copy Reference</button>
    </div>

    <p class="footer-note">
      Need help right away? <a href="mailto:support@example.com">Contact support</a>.
    </p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");
    const email = params.get("email");
    const ref = params.get("ref");

    if (name) {
      document.getElementById("message").textContent =
        `Thank you, ${name}. We have received your submission and will follow up shortly.`;
    }

    if (email || ref) {
      const detailsBox = document.getElementById("details");
      detailsBox.hidden = false;

      const refValue = ref || `REF-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
      document.getElementById("ref-id").textContent = refValue;
      document.getElementById("user-email").textContent = email || "Confirmed";

      const copyBtn = document.getElementById("copy-btn");
      copyBtn.hidden = false;
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(refValue);
          copyBtn.textContent = "Copied!";
          setTimeout(() => (copyBtn.textContent = "Copy Reference"), 2000);
        } catch {
          copyBtn.textContent = refValue;
        }
      });
    }
  </script>
</body>
</html>
