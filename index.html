<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | TMGM Partners</title>
<!-- Thank-you pages must not be indexed -->
<meta name="robots" content="noindex, nofollow">
<!-- TODO (OP team): add the same Google Tag Manager / Google tag snippet that is on the live pages here -->
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;background:#f5f7fa;line-height:1.5}
  main{max-width:640px;margin:0 auto;padding:64px 24px;text-align:center}
  .tick{width:64px;height:64px;border-radius:50%;background:#e6f4ea;color:#1e8e3e;font-size:36px;line-height:64px;margin:0 auto 24px}
  h1{font-size:28px;margin:0 0 12px}
  p{font-size:16px;margin:0 0 16px}
  ol{text-align:left;max-width:460px;margin:24px auto;padding-left:20px}
  li{margin-bottom:8px}
  .btns{margin-top:32px}
  .btn{display:inline-block;margin:6px;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:bold;border:2px solid #1f3864}
  .btn.primary{background:#1f3864;color:#fff}
  .btn.secondary{color:#1f3864;background:#fff}
  small{display:block;margin-top:32px;color:#666}
</style>
</head>
<!--
  ONE TEMPLATE, FIVE PAGES.
  Set data-page on <body> to: home | ib | affiliate | hybrid | influencer.
  Copy for each page is in the PAGES object below. Square brackets [ ] = to be confirmed.
-->
<body data-page="ib">
<main>
  <div class="tick" aria-hidden="true">&#10003;</div>
  <h1 id="ty-title" tabindex="-1"></h1>
  <p id="ty-lead"></p>
  <ol id="ty-steps"></ol>
  <div class="btns">
    <a id="ty-primary" class="btn primary" href="#"></a>
    <a id="ty-secondary" class="btn secondary" href="#"></a>
  </div>
  <small>Questions? Email <a href="mailto:partners@tmgm.com">partners@tmgm.com</a> [confirm address]. This tab can be closed.</small>
</main>

<script>
var PAGES = {
  home: {
    title: "Thank you, we've received your details",
    lead: "Thanks for your interest in the TMGM Partners Program. Our partnership team will get in touch to help you find the program that suits you best.",
    steps: ["We review your details.", "A partnership manager contacts you within [X] business days.", "Together we choose the right program and get you set up."],
    primary: ["Explore our programs", "/"],
    secondary: ["Log in to the partner portal", "https://portal.tmgm.com"]
  },
  ib: {
    title: "Thank you, your IB application is in",
    lead: "Thanks for your interest in becoming a TMGM Introducing Broker. We've received your details.",
    steps: ["We review your details.", "A partnership manager contacts you within [X] business days.", "They'll walk you through the IB program and your next steps."],
    primary: ["Back to the IB page", "/ib/"],
    secondary: ["Log in to the partner portal", "https://portal.tmgm.com"]
  },
  affiliate: {
    title: "Thank you, your Affiliate application is in",
    lead: "Thanks for your interest in the TMGM Affiliate Program. We've received your details.",
    steps: ["We review your details.", "A partnership manager contacts you within [X] business days.", "They'll explain how the program works and help you get started."],
    primary: ["Back to the Affiliate page", "/affiliate/"],
    secondary: ["Log in to the partner portal", "https://portal.tmgm.com"]
  },
  hybrid: {
    title: "Thank you, your Hybrid Program application is in",
    lead: "Thanks for your interest in the TMGM Hybrid Program. We've received your details.",
    steps: ["We review your details and check the program is available in your country.", "A partnership manager contacts you within [X] business days.", "They'll walk you through the program and your next steps."],
    primary: ["Back to the Hybrid page", "/hybrid/"],
    secondary: ["Log in to the partner portal", "https://portal.tmgm.com"]
  },
  influencer: {
    title: "Thank you, your Influencer application is in",
    lead: "Thanks for your interest in the TMGM Influencer Partnership Program. We've received your details.",
    steps: ["We review your details and channels.", "A partnership manager contacts you within [X] business days.", "They'll go through the program, your content plan and the next steps."],
    primary: ["Back to the Influencer page", "/influencer/"],
    secondary: ["Log in to the partner portal", "https://portal.tmgm.com"]
  }
};
(function () {
  var key = document.body.getAttribute("data-page");
  var p = PAGES[key] || PAGES.home;
  document.getElementById("ty-title").textContent = p.title;
  document.getElementById("ty-lead").textContent = p.lead;
  var ol = document.getElementById("ty-steps");
  p.steps.forEach(function (s) { var li = document.createElement("li"); li.textContent = s; ol.appendChild(li); });
  var a = document.getElementById("ty-primary"); a.textContent = p.primary[0]; a.href = p.primary[1];
  var b = document.getElementById("ty-secondary"); b.textContent = p.secondary[0]; b.href = p.secondary[1];
  document.title = p.title + " | TMGM Partners";
  document.getElementById("ty-title").focus();
})();
</script>
</body>
</html>
